<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Podcast App</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="page-width header-top">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">🎙️</span>
          <span class="brand-title">PodcastApp</span>
        </div>
        <div class="header-actions">
          <button class="icon-button" aria-label="Search podcasts">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="page-width">
      <section>
        <h2>Podcast Shows</h2>
        <div class="toolbar">
          <label class="toolbar-group">
            <span>Filter by:</span>
            <select id="genreFilter">
              <option value="all">All Genres</option>
            </select>
          </label>
          <label class="toolbar-group">
            <span>Sort by:</span>
            <select id="sortOrder">
              <option value="updated">Recently Updated</option>
              <option value="title">Title A - Z</option>
            </select>
          </label>
        </div>
        <div id="podcastGrid" class="podcast-grid"></div>
      </section>
    </main>

    <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-wrapper">
        <button id="closeModal" class="modal-close" aria-label="Close details modal">×</button>
        <img id="modalImage" class="modal-image" src="" alt="Podcast cover" />
        <div class="modal-content">
          <h2 id="modalTitle"></h2>
          <div id="modalGenres" class="modal-genres"></div>
          <p id="modalUpdated" class="modal-updated"></p>
          <div id="modalSeasons" class="modal-seasons"></div>
          <p id="modalDescription" class="modal-description"></p>
        </div>
      </div>
    </div>

    <script type="module" src="./src/index.js"></script>
  </body>
</html>
